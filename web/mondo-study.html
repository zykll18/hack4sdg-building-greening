<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦冬模型试作 · EcoMetroLink</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#234434;font:14px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:30px 24px}h1{margin:4px 0 12px;font-size:28px}p{line-height:1.7;color:#607669}.label{font-size:11px;letter-spacing:.1em}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;border:1px solid #fff;background:#ffffffb0;border-radius:20px;overflow:hidden}#model-preview,.reference{width:100%;height:420px}.reference{object-fit:cover;display:block}#model-preview canvas{display:block;width:100%;height:100%}figcaption{padding:16px 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,a{font:inherit;color:inherit;border:1px solid #c7d8ca;background:white;padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#255a40;color:white}#stats{font-size:12px}#error{color:#a13535}@media(max-width:700px){.views{grid-template-columns:1fr}#model-preview,.reference{height:360px}}

<body><main>
<p class="label">ECOMETROLINK / MODEL STUDY 01</p><h1>麦冬 · 叶片与草丛试作</h1>
<p>按参考照片制作的第一阶段草稿。完整株形、根部布局和显示尺寸均为推测，尚未通过外观验收。</p>
<nav aria-label="模型视角"><button data-angle="0" aria-pressed="true">正面</button><button data-angle="90">右侧</button><button data-angle="180">背面</button><button data-angle="270">左侧</button><button id="reference-view">叶片近景</button><button id="shape-view" aria-pressed="false">形态检查</button><button id="old-model">查看原模型</button><button id="new-model" hidden>查看试作</button></nav>
<div class="views"><figure><div id="model-preview" aria-label="可旋转麦冬模型"></div><figcaption>拖动旋转 · 滚轮缩放。<span id="stats" role="status">正在准备模型…</span></figcaption></figure><figure><img class="reference" src="/plants/library/ophiopogon-japonicus.jpg" alt="麦冬参考照片：交叠的细长叶片"><figcaption>参考照片：David J. Stang · <a href="https://commons.wikimedia.org/wiki/File:Ophiopogon_japonicus_4zz.jpg">Wikimedia Commons</a> · CC BY-SA 4.0</figcaption></figure></div>
<p id="error" role="alert"></p><p>检查重点：细窄叶身、连续弯曲、尖端、纵向折痕。此试作不改变种植面积或影响计算。</p>
</main><script type="module" src="/mondo-study.js"></script></body></html>
